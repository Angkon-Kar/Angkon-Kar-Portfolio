<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - Angkon Kar</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <script>
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpg" href="assets/angkonkar.jpg">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-200 antialiased transition-colors duration-300">

    <header class="bg-white dark:bg-gray-800 shadow-lg py-4 px-6 md:px-12 fixed w-full z-50 top-0 transition-colors duration-300">
    <nav class="flex flex-col md:flex-row justify-between items-center max-w-7xl mx-auto">
        <a href="index.html" class="text-2xl font-bold text-blue-600 dark:text-blue-400 hover:text-blue-500 transition-colors duration-300 mb-2 md:mb-0">
        Angkon Kar
        </a>
        <ul class="flex items-center space-x-6 md:space-x-8">
        <li><a href="index.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-300 font-medium">Home</a></li>
        <li><a href="about.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-300 font-medium">About</a></li>
        <li><a href="projects.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-300 font-medium border-b-2 border-blue-600 dark:border-blue-400">Projects</a></li>
        <li><a href="certifications.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-300 font-medium">Certifications</a></li>
        <li>
          <button id="theme-toggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors focus:outline-none">
              <i id="theme-toggle-dark-icon" data-lucide="moon" class="hidden w-5 h-5"></i>
              <i id="theme-toggle-light-icon" data-lucide="sun" class="hidden w-5 h-5"></i>
          </button>
        </li>
        </ul>
    </nav>
    </header>

    <div class="pt-28"></div>

    <div class="fixed top-0 -left-4 w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob z-0"></div>
    <div class="fixed top-20 -right-4 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000 z-0"></div>

    <main class="relative z-10 px-6 md:px-12 max-w-4xl mx-auto pb-24">

        <a href="projects.html" class="inline-flex items-center text-blue-600 dark:text-blue-400 font-medium hover:text-blue-500 mb-8 transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5 mr-2"></i> Back to Projects
        </a>

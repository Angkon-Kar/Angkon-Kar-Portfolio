<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angkon Kar - Contact</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <script>
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpg" href="assets/angkonkar.jpg">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-200 antialiased transition-colors duration-300">

    <header class="bg-white dark:bg-gray-800 shadow-lg py-4 px-6 md:px-12 fixed w-full z-50 top-0 transition-colors duration-300">
    <nav class="flex flex-col md:flex-row justify-between items-center max-w-7xl mx-auto">
        <a href="index.html" class="text-2xl font-bold text-blue-600 dark:text-blue-400 hover:text-blue-500 transition-colors duration-300 mb-2 md:mb-0">
        Angkon Kar
        </a>
        <ul class="flex flex-wrap items-center justify-center gap-x-5 gap-y-3 md:gap-x-6">
        <li><a href="index.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-300 font-medium">Home</a></li>
        <li class="relative">
          <button type="button" data-dropdown="about-dropdown" class="nav-dropdown-btn text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-300 font-medium flex items-center gap-1">
            About <i data-lucide="chevron-down" class="w-4 h-4 transition-transform"></i>
          </button>
          <div id="about-dropdown" class="nav-dropdown bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-2xl overflow-hidden">
            <a href="about.html" class="flex items-center gap-3 px-4 py-3 text-sm transition-colors text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"><i data-lucide="user" class="w-4 h-4"></i> Overview</a>
            <a href="experience.html" class="flex items-center gap-3 px-4 py-3 text-sm transition-colors text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"><i data-lucide="briefcase" class="w-4 h-4"></i> Experience & Leadership</a>
            <a href="achievements.html" class="flex items-center gap-3 px-4 py-3 text-sm transition-colors text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"><i data-lucide="trophy" class="w-4 h-4"></i> Achievements</a>
            <a href="elsewhere.html" class="flex items-center gap-3 px-4 py-3 text-sm transition-colors text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"><i data-lucide="share-2" class="w-4 h-4"></i> Elsewhere</a>
          </div>
        </li>
        <li class="relative">
          <button type="button" data-dropdown="projects-dropdown" class="nav-dropdown-btn text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-300 font-medium flex items-center gap-1">
            Projects <i data-lucide="chevron-down" class="w-4 h-4 transition-transform"></i>
          </button>
          <div id="projects-dropdown" class="nav-dropdown bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-2xl overflow-hidden">
            <a href="projects.html" class="flex items-center gap-3 px-4 py-3 text-sm transition-colors text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"><i data-lucide="layout-grid" class="w-4 h-4"></i> All Projects</a>
            <a href="extensions.html" class="flex items-center gap-3 px-4 py-3 text-sm transition-colors text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700"><i data-lucide="puzzle" class="w-4 h-4"></i> Extensions</a>
          </div>
        </li>
        <li><a href="certifications.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-300 font-medium">Certifications</a></li>
        <li><a href="contact.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-300 font-medium border-b-2 border-blue-600 dark:border-blue-400">Contact</a></li>
        <li>
          <button id="theme-toggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors focus:outline-none">
              <i id="theme-toggle-dark-icon" data-lucide="moon" class="hidden w-5 h-5"></i>
              <i id="theme-toggle-light-icon" data-lucide="sun" class="hidden w-5 h-5"></i>
          </button>
        </li>
        </ul>
    </nav>
    </header>

    <div class="pt-28"></div>

    <div class="fixed top-0 -left-4 w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob z-0"></div>
    <div class="fixed top-20 -right-4 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000 z-0"></div>

    <main class="page-grow relative z-10 px-6 md:px-12 max-w-5xl mx-auto">


        <section id="contact" class="mb-20">
            <h2 class="text-4xl font-bold text-center text-blue-600 dark:text-blue-400 mb-12 flex items-center justify-center">
                <i data-lucide="mail" class="w-9 h-9 mr-3"></i> Get In Touch
            </h2>
            
            <div class="max-w-3xl mx-auto glow-card bg-white dark:bg-gray-800 p-8 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-xl dark:shadow-2xl transition-colors duration-300">
                <form id="contact-form" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="name" class="block text-gray-700 dark:text-gray-300 font-medium mb-2">Your Name</label>
                            <input type="text" id="name" name="name" required placeholder="Angkon Kar" 
                                class="w-full bg-gray-50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-3 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                        </div>
                        <div>
                            <label for="email" class="block text-gray-700 dark:text-gray-300 font-medium mb-2">Your Email</label>
                            <input type="email" id="email" name="email" required placeholder="angkon310@gmail.com" 
                                class="w-full bg-gray-50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-3 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                        </div>
                    </div>
                    
                    <div>
                        <label for="message" class="block text-gray-700 dark:text-gray-300 font-medium mb-2">Message</label>
                        <textarea id="message" name="message" rows="5" required placeholder="Let's build something amazing together..." 
                            class="w-full bg-gray-50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-3 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all resize-none"></textarea>
                    </div>
                    
                    <button type="submit" id="submit-btn" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-all flex justify-center items-center group">
                        Send Message 
                        <i data-lucide="send" class="w-5 h-5 ml-2 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                    
                    <p id="form-status" class="text-center mt-4 hidden font-medium"></p>
                </form>
            </div>
        </section>

    </main>

    <footer class="bg-gray-200 dark:bg-gray-800 py-10 text-center text-gray-600 dark:text-gray-500 border-t border-gray-300 dark:border-gray-700 transition-colors duration-300">
        <p>&copy; <span id="current-year"></span> Angkon Kar. All rights reserved.</p>
    </footer>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="toast.js"></script>
    <script src="devtools.js"></script>
    <script src="mascot.js"></script>
    <script src="script.js"></script>
</body>
</html>
